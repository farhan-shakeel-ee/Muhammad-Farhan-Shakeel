<!doctype html>
<html lang="en">

<head>

    <script>
        if (localStorage.getItem("portfolio-theme") !== "light") document.documentElement.classList.add("dark-mode-preload");
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Articles | Farhan Portfolio</title>

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/reference-theme.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <a class="logo" href="index.html">
                Engr. <span>FARHAN</span>
            </a>

            <ul class="nav-links"></ul>

            <div class="nav-right">
                <a class="resume-btn" href="assets/resume/resume.pdf">
                    Resume
                </a>
            </div>

            <div class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </div>

        </nav>
    </header>

    <div class="overlay"></div>

    <nav class="mobile-nav">
        <ul></ul>
    </nav>

    <main>

        <section>

            <div class="container article-index">

                <div class="section-title">

                    <span">Technical Articles</span>

                    <h2>
                        Articles and Insights
                    </h2>

                    <p>
                        Practical notes on electronics, embedded development,
                        digital systems, and the engineering habits behind my projects.
                    </p>

                </div>

                <div class="article-toolbar">

                    <input
                        id="articleSearch"
                        type="search"
                        placeholder="Search articles..."
                    >

                    <div
                        id="articleFilters"
                        class="article-filters"
                    >

                        <button
                            class="active"
                            type="button"
                            data-article-filter="all"
                        >
                            All
                        </button>

                    </div>

                </div>

                <div
                    id="articleGrid"
                    class="article-grid"
                ></div>

            </div>

        </section>

    </main>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/articles.js"></script>

</body>

</html>
